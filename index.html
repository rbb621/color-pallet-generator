<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palete Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" >
        <h1>Color Palette Generator</h1>

        <!-- GENERATE BUTTON -->

        <button id ='generate-btn'>
            <link rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" 
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer">
            <i class="fas fa-sync-alt"></i>
            Generate Palette
        </button>

        <div class="palette-container">

        <!-- COLOR BOX 1 -->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe;"></div>
            <div class="color-info">
                <span class='hex-value'>#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!-- COLOR BOX 2 -->
        <div class="color-box">
            <div class="color" style="background-color: #1596d2;"></div>
                <div class="color-info">
                    <span class='hex-value'>#1596D2</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
        <!-- COLOR BOX 3 -->
        <div class="color-box">
            <div class="color" style="background-color: #0d73a2;"></div>
                <div class="color-info">
                    <span class='hex-value'>#0D73A2</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>

        <!-- COLOR BOX 4 -->
        <div class="color-box">
            <div class="color" style="background-color: #12729f;"></div>
                <div class="color-info">
                    <span class='hex-value'>#12729F</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>

        <!-- COLOR BOX 5 -->
        <div class="color-box">
            <div class="color" style="background-color: #30718f;"></div>
            <div class="color-info">
                <span class='hex-value'>#E1F5FE</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
